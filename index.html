<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caring Socratic Tutor - Grade 7 English</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0c0f1d; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    #app-layout { display: flex; gap: 16px; width: 100%; max-width: 980px; height: 640px; }

    /* Control Panel */
    #media-panel {
      width: 260px; background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #webcam-view { width: 100%; height: 160px; background: #0c0f1d; border: 2px dashed #475569; border-radius: 8px; object-fit: cover; }
    
    .media-btn {
      width: 100%; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 6px;
      border: 1px solid #475569; background: #2e3b5e; color: #f8fafc; cursor: pointer; transition: 0.2s;
    }
    .media-btn:hover { background: #38bdf8; color: #0c0f1d; }

    /* Tutor Chat Window */
    #tutor-container {
      flex: 1; background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #tutor-header {
      padding: 12px 20px; background: #1e293b; border-bottom: 2px solid #2e3b5e;
      display: flex; justify-content: space-between; align-items: center;
    }
    #tutor-title { font-size: 16px; font-weight: bold; color: #38bdf8; }
    .stat-val { color: #f59e0b; font-weight: bold; }
    .timer-val { color: #38bdf8; font-weight: bold; }

    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #0c0f1d; }

    .msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; font-size: 15px; line-height: 1.5; }
    .bot-msg { background: #1e293b; color: #f8fafc; border: 1px solid #2e3b5e; align-self: flex-start; border-bottom-left-radius: 2px; }
    .user-msg { background: #0284c7; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 2px; }

    #input-area { padding: 14px 20px; background: #1e293b; border-top: 2px solid #2e3b5e; display: flex; gap: 10px; align-items: center; }
    #user-input { flex: 1; padding: 12px; font-size: 15px; border: 2px solid #475569; background: #151c2e; color: #f8fafc; border-radius: 8px; outline: none; }
    #user-input:focus { border-color: #38bdf8; }
    
    button { background: #0284c7; color: #ffffff; font-weight: 600; border: none; padding: 10px 18px; font-size: 14px; cursor: pointer; border-radius: 8px; transition: background 0.2s; }
    button:hover { background: #0369a1; }

    #mic-btn { background: #d97706; border: 1px solid #f59e0b; }
    #mic-btn.listening { background: #ef4444; border-color: #f87171; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .form-box { background: #151c2e; border: 2px solid #38bdf8; border-radius: 10px; padding: 20px; text-align: center; margin: auto; width: 90%; }
    .form-group { display: flex; gap: 8px; justify-content: center; margin: 14px 0; }
    .input-field { padding: 10px; font-size: 14px; border: 1px solid #475569; background: #0c0f1d; color: #f8fafc; border-radius: 6px; text-align: center; }
  </style>
</head>
<body>

<div id="app-layout">
  <div id="media-panel">
    <video id="webcam-view" autoplay playsinline muted></video>
    <button class="media-btn" id="cam-btn" onclick="toggleWebcam()">📷 START WEBCAM</button>
    <button class="media-btn" id="tts-btn" onclick="toggleTTS()">🔊 TUTOR VOICE: ON</button>
    <div style="font-size: 12px; color: #94a3b8; text-align: center; margin-top: auto; line-height: 1.4;">
      ⏰ <b>2-Minute Session</b><br>Talk to your tutor in English!
    </div>
  </div>

  <div id="tutor-container">
    <div id="tutor-header">
      <div id="tutor-title">🤝 Socratic Tutor</div>
      <div>
        ⏰ TIME: <span id="timer-val" class="timer-val">02:00</span> | 
        ⭐ STARS: <span id="score-val" class="stat-val">0</span>
      </div>
    </div>

    <div id="chat-box"></div>

    <div id="input-area" class="hidden">
      <button id="mic-btn" onclick="toggleSpeechRecognition()">🎤 SPEAK</button>
      <input type="text" id="user-input" placeholder="Say something in English..." autocomplete="off">
      <button id="send-btn" onclick="handleUserReply()">SEND</button>
    </div>
  </div>
</div>

<script>
  // Google Apps Script URL for Leaderboard integration
  const LEADERBOARD_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbweupbTyu0WbLlOFFHGP9FuieboEVWYfFHMHKoUDQsEfB6EQFL3-U4PWHUZyH7v3FBfOQ/exec";

  let studentProfile = { name: "", className: "", seatNum: "" };
  let timeLeft = 120;
  let timerInterval = null;
  let score = 0;
  let currentStep = 0;
  let ttsEnabled = true;
  let recognition = null;
  let isListening = false;
  let webcamStream = null;

  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("user-input");
  const micBtn = document.getElementById("mic-btn");

  const TUTOR_STEPS = [
    {
      topic: "Greeting & Warmup",
      question: "Hello! What is your name, and how are you feeling today?",
      evaluate: (text) => {
        if (text.length < 2) return { pass: false, reply: "Can you tell me your name or how you feel?" };
        return { pass: true, reply: "Nice to meet you! It's so good to talk with you today 😊" };
      }
    },
    {
      topic: "Polite Request (Needs)",
      question: "Imagine you are thirsty in class and want water. How do you ask nicely? (Hint: Use 'Please...')",
      evaluate: (text) => {
        const lower = text.toLowerCase();
        if (lower.includes("please") || lower.includes("water") || lower.includes("drink")) {
          return { pass: true, reply: "Awesome! Saying 'Please' or 'Water, please' is super polite! 👍" };
        }
        if (lower.includes("game") || lower.includes("play") || lower.includes("dog") || lower.includes("sleep")) {
          return { pass: false, reply: "Haha, that sounds fun! But if you are thirsty, try saying: 'Please give me water!'. Can you try?" };
        }
        return { pass: false, reply: "Try using the word 'Please'! For example: 'Please give me water'." };
      }
    },
    {
      topic: "Food Suggestion (Let's)",
      question: "You and your friend are hungry after school! How do you suggest eating together? (Hint: 'Let's eat...')",
      evaluate: (text) => {
        const lower = text.toLowerCase();
        if (lower.includes("let's") || lower.includes("lets") || lower.includes("eat") || lower.includes("tea") || lower.includes("bento")) {
          return { pass: true, reply: "Yum! 'Let's eat...' is a great way to make plans with friends!" };
        }
        return { pass: false, reply: "Try starting with 'Let's eat...'! For example: 'Let's eat bento!' or 'Let's drink boba tea!'" };
      }
    },
    {
      topic: "Classroom Care (Imperatives)",
      question: "Your friend is running fast in class and might fall down. What warning can you tell them? (Hint: 'Don't...')",
      evaluate: (text) => {
        const lower = text.toLowerCase();
        if (lower.includes("don't") || lower.includes("dont") || lower.includes("run") || lower.includes("careful") || lower.includes("stop")) {
          return { pass: true, reply: "Great caring job! Saying 'Don't run' or 'Be careful' keeps everyone safe! ❤️" };
        }
        return { pass: false, reply: "You can say: 'Don't run!' or 'Be careful!'. Give it a try!" };
      }
    }
  ];

  // Initialize Speech Recognition
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => { isListening = true; micBtn.classList.add("listening"); micBtn.textContent = "🎙️ LISTENING..."; };
    recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserReply(); };
    recognition.onerror = recognition.onend = () => { isListening = false; micBtn.classList.remove("listening"); micBtn.textContent = "🎤 SPEAK"; };
  } else {
    micBtn.disabled = true; micBtn.textContent = "🎤 NO VOICE";
  }

  function toggleSpeechRecognition() {
    if (!recognition) return;
    if (isListening) recognition.stop(); else recognition.start();
  }

  function speakText(text) {
    if (!ttsEnabled || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.88;
    window.speechSynthesis.speak(u);
  }

  function toggleTTS() {
    ttsEnabled = !ttsEnabled;
    document.getElementById("tts-btn").textContent = ttsEnabled ? "🔊 TUTOR VOICE: ON" : "🔇 TUTOR VOICE: OFF";
    if (!ttsEnabled) window.speechSynthesis.cancel();
  }

  async function toggleWebcam() {
    const videoEl = document.getElementById("webcam-view");
    const camBtn = document.getElementById("cam-btn");
    if (webcamStream) {
      webcamStream.getTracks().forEach(t => t.stop());
      webcamStream = null; videoEl.srcObject = null;
      camBtn.textContent = "📷 START WEBCAM";
    } else {
      try {
        webcamStream = await navigator.mediaDevices.getUserMedia({ video: true });
        videoEl.srcObject = webcamStream;
        camBtn.textContent = "🛑 STOP WEBCAM";
      } catch (e) { alert("Camera access blocked."); }
    }
  }

  function appendMessage(sender, text) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg " + (sender === "user" ? "user-msg" : "bot-msg");
    msgDiv.textContent = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    if (sender === "bot") speakText(text);
  }

  function renderStudentForm() {
    chatBox.innerHTML = `
      <div class="form-box">
        <h3>👋 Welcome Student!</h3>
        <p>Please enter your information to start talking with the tutor:</p>
        <div class="form-group">
          <input type="text" id="stu-name" class="input-field" placeholder="Name" required>
          <input type="text" id="stu-class" class="input-field" placeholder="Class (e.g. 701)">
          <input type="text" id="stu-seat" class="input-field" placeholder="Seat #">
        </div>
        <button onclick="startSession()">START TALKING</button>
      </div>
    `;
  }

  function startSession() {
    const name = document.getElementById("stu-name").value.trim() || "Anonymous";
    const className = document.getElementById("stu-class").value.trim() || "-";
    const seatNum = document.getElementById("stu-seat").value.trim() || "-";

    studentProfile = { name, className, seatNum };

    chatBox.innerHTML = "";
    document.getElementById("input-area").classList.remove("hidden");
    
    score = 0; currentStep = 0; timeLeft = 120;
    startTimer();

    appendMessage("bot", TUTOR_STEPS[currentStep].question);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
      document.getElementById("timer-val").textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      if (timeLeft <= 0) finishSession(true);
    }, 1000);
  }

  function handleUserReply() {
    const text = userInput.value.trim();
    if (!text || currentStep >= TUTOR_STEPS.length) return;

    appendMessage("user", text);
    userInput.value = "";

    const step = TUTOR_STEPS[currentStep];
    const res = step.evaluate(text);

    if (res.pass) {
      score += 25;
      document.getElementById("score-val").textContent = score;
      appendMessage("bot", res.reply);

      currentStep++;
      setTimeout(() => {
        if (currentStep < TUTOR_STEPS.length) {
          appendMessage("bot", TUTOR_STEPS[currentStep].question);
        } else {
          finishSession(false);
        }
      }, 1800);
    } else {
      setTimeout(() => { appendMessage("bot", res.reply); }, 800);
    }
  }

  async function finishSession(isTimeOut) {
    clearInterval(timerInterval);
    document.getElementById("input-area").classList.add("hidden");

    const payload = {
      name: studentProfile.name,
      className: studentProfile.className,
      seatNum: studentProfile.seatNum,
      score: score,
      accuracy: isTimeOut ? "Time Expired" : "100% Complete"
    };

    // Save locally
    try {
      let localData = JSON.parse(localStorage.getItem("tutor_scores") || "[]");
      localData.push(payload);
      localStorage.setItem("tutor_scores", JSON.stringify(localData));
    } catch(e) {}

    // Post to Google Apps Script Leaderboard
    try {
      if (LEADERBOARD_WEBAPP_URL !== "PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        await fetch(LEADERBOARD_WEBAPP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
      }
    } catch(e) {}

    const reportCard = document.createElement("div");
    reportCard.className = "form-box";
    reportCard.innerHTML = `
      <h2>🎓 SESSION COMPLETE!</h2>
      <p>Great job practicing English today, <b>${studentProfile.name}</b>!</p>
      <h1 style="color:#f59e0b; font-size: 42px; margin: 10px 0;">⭐ ${score} Stars</h1>
      <p>Score saved to Leaderboard (Class ${studentProfile.className}, Seat ${studentProfile.seatNum}).</p>
      <br>
      <button onclick="renderStudentForm()">TALK AGAIN</button>
    `;
    chatBox.appendChild(reportCard);
    chatBox.scrollTop = chatBox.scrollHeight;
    speakText("Great job practicing English today! Your score has been saved!");
  }

  userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleUserReply(); });

  // Initial load
  renderStudentForm();
</script>
</body>
</html>

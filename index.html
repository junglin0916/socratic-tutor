<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caring Socratic Tutor - Grade 7 English</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0c0f1d; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    
    #app-layout { display: flex; flex-direction: column; width: 100%; max-width: 900px; height: 92vh; gap: 10px; }

    /* Top Compact Control Bar */
    #top-bar {
      background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px;
      padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .hud-info { font-size: 18px; font-weight: bold; color: #f8fafc; }
    .hud-highlight { color: #f59e0b; }
    .hud-time { color: #38bdf8; }

    .ctrl-group { display: flex; gap: 8px; align-items: center; }
    .top-btn {
      padding: 8px 14px; font-size: 14px; font-weight: bold; border-radius: 6px;
      border: 1px solid #475569; background: #2e3b5e; color: #f8fafc; cursor: pointer; transition: 0.2s;
    }
    .top-btn:hover { background: #38bdf8; color: #0c0f1d; }

    /* Main Chat Window */
    #tutor-container {
      flex: 1; background: #151c2e; border: 2px solid #2e3b5e; border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #0c0f1d; }

    /* Larger Message Bubbles & Fonts */
    .msg { max-width: 88%; padding: 14px 20px; border-radius: 12px; font-size: 19px; line-height: 1.5; }
    .bot-msg { background: #1e293b; color: #f8fafc; border: 1px solid #2e3b5e; align-self: flex-start; border-bottom-left-radius: 2px; }
    .user-msg { background: #0284c7; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 600; }

    /* Input Controls */
    #input-area { padding: 12px 16px; background: #1e293b; border-top: 2px solid #2e3b5e; display: flex; gap: 10px; align-items: center; }
    #user-input { flex: 1; padding: 14px 18px; font-size: 18px; border: 2px solid #475569; background: #151c2e; color: #f8fafc; border-radius: 8px; outline: none; }
    #user-input:focus { border-color: #38bdf8; }
    
    button.action-btn { background: #0284c7; color: #ffffff; font-weight: bold; border: none; padding: 14px 24px; font-size: 18px; cursor: pointer; border-radius: 8px; transition: background 0.2s; }
    button.action-btn:hover { background: #0369a1; }

    #mic-btn { background: #d97706; border: 1px solid #f59e0b; color: #fff; font-weight: bold; padding: 14px 20px; font-size: 18px; border-radius: 8px; cursor: pointer; }
    #mic-btn.listening { background: #ef4444; border-color: #f87171; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .form-box { background: #151c2e; border: 2px solid #38bdf8; border-radius: 12px; padding: 24px; text-align: center; margin: auto; width: 92%; }
    .form-box h2 { font-size: 26px; color: #38bdf8; margin-bottom: 12px; }
    .form-box p { font-size: 18px; color: #cbd5e1; margin-bottom: 16px; }
    .form-group { display: flex; gap: 10px; justify-content: center; margin: 16px 0; }
    .input-field { padding: 12px; font-size: 18px; border: 1px solid #475569; background: #0c0f1d; color: #f8fafc; border-radius: 8px; text-align: center; width: 30%; }

    .hidden { display: none !important; }
    #webcam-view { width: 120px; height: 75px; background: #0c0f1d; border: 1px solid #475569; border-radius: 6px; object-fit: cover; display: none; }
  </style>
</head>
<body>

<div id="app-layout">
  <!-- Compact Top Bar -->
  <div id="top-bar">
    <div class="hud-info">
      ⏰ <span id="timer-val" class="hud-time">02:00</span> | 
      ⭐ STARS: <span id="score-val" class="hud-highlight">0</span>
    </div>
    <div class="ctrl-group">
      <video id="webcam-view" autoplay playsinline muted></video>
      <button class="top-btn" id="cam-btn" onclick="toggleWebcam()">📷 WEBCAM</button>
      <button class="top-btn" id="tts-btn" onclick="toggleTTS()">🔊 VOICE: ON</button>
    </div>
  </div>

  <!-- Tutor Main Panel -->
  <div id="tutor-container">
    <div id="chat-box"></div>

    <div id="input-area" class="hidden">
      <button id="mic-btn" onclick="toggleSpeechRecognition()">🎤 SPEAK</button>
      <input type="text" id="user-input" placeholder="Type or speak in English..." autocomplete="off">
      <button class="action-btn" onclick="handleUserReply()">SEND</button>
    </div>
  </div>
</div>

<script>
  // Google Apps Script Web App URL (Optional)
  const LEADERBOARD_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbweupbTyu0WbLlOFFHGP9FuieboEVWYfFHMHKoUDQsEfB6EQFL3-U4PWHUZyH7v3FBfOQ/exec";

  let studentProfile = { name: "", className: "", seatNum: "" };
  let timeLeft = 120;
  let timerInterval = null;
  let score = 0;
  let currentStep = 0;
  let ttsEnabled = true;
  let recognition = null;
  let isListening = false;
  let webcamStream = null;

  const chatBox = document.getElementById("chat-box");
  const userInput = document.getElementById("user-input");
  const micBtn = document.getElementById("mic-btn");

  const TUTOR_STEPS = [
    {
      topic: "Greeting & Warmup",
      question: "Hello! 👋 What is your name, and how are you feeling today?",
      evaluate: (text) => {
        const lower = text.toLowerCase().trim();
        if (lower.includes("blah") || lower.length < 2) {
          return { pass: false, reply: "I didn't quite catch that! Try saying: 'I am happy' or 'I am tired'. How do you feel?" };
        }
        if (lower.includes("fine") || lower.includes("good") || lower.includes("happy") || lower.includes("tired")) {
          if (!lower.includes("i am") && !lower.includes("i'm")) {
            return { pass: true, reply: "I understand! A full sentence sounds even better: 'I am " + text + ".' Great start! 😊" };
          }
          return { pass: true, reply: "Awesome! It's so good to talk with you today 😊" };
        }
        return { pass: true, reply: "Nice to meet you! Thank you for telling me how you feel!" };
      }
    },
    {
      topic: "Polite Request (Needs)",
      question: "Imagine you are thirsty in class and want water. How do you ask nicely? (Hint: Use 'Please...')",
      evaluate: (text) => {
        const lower = text.toLowerCase().trim();
        if (lower.includes("blah") || lower.length < 2) {
          return { pass: false, reply: "Try making a request! Say: 'Please give me water.'" };
        }
        if (lower.includes("please") && (lower.includes("water") || lower.includes("give") || lower.includes("drink"))) {
          return { pass: true, reply: "Perfect English! Adding 'Please' makes your request polite! 👍" };
        }
        if (lower.includes("water") || lower.includes("drink")) {
          return { pass: false, reply: "You got the right word! Now add 'Please' to make it polite: 'Please give me water!'" };
        }
        return { pass: false, reply: "Let's practice! Try saying: 'Please give me water.'" };
      }
    },
    {
      topic: "Food Suggestion (Let's)",
      question: "You and your friend are hungry after school! How do you suggest eating together? (Hint: Start with 'Let's eat...')",
      evaluate: (text) => {
        const lower = text.toLowerCase().trim();
        if (lower.includes("blah") || lower.length < 2) {
          return { pass: false, reply: "Start your sentence with 'Let's eat...'!" };
        }
        if (lower.includes("let's") || lower.includes("lets")) {
          return { pass: true, reply: "Yum! 'Let's eat...' is a great pattern to invite your friends!" };
        }
        if (lower.includes("bento") || lower.includes("rice") || lower.includes("tea") || lower.includes("boba") || lower.includes("noodle")) {
          return { pass: false, reply: "Sounds delicious! Add 'Let's' to the front: 'Let's eat " + text + "!' Try saying that!" };
        }
        return { pass: false, reply: "Try starting with 'Let's eat...'! For example: 'Let's eat bento!'" };
      }
    },
    {
      topic: "Classroom Care (Imperatives)",
      question: "Your friend is running fast in class and might fall down. What warning can you tell them? (Hint: 'Don't...')",
      evaluate: (text) => {
        const lower = text.toLowerCase().trim();
        if (lower.includes("blah") || lower.length < 2) {
          return { pass: false, reply: "Try warning them! Use 'Don't...' or 'Be careful!'." };
        }
        if (lower.includes("don't") || lower.includes("dont") || lower.includes("stop") || lower.includes("careful")) {
          return { pass: true, reply: "Great job caring for your friend! 'Don't run' keeps everyone safe! ❤️" };
        }
        if (lower.includes("run")) {
          return { pass: false, reply: "Close! Put 'Don't' in front to tell them NOT to run: 'Don't run!'. Try that!" };
        }
        return { pass: false, reply: "You can say: 'Don't run!' or 'Be careful!'. Give it a try!" };
      }
    }
  ];

  // Speech Recognition
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => { isListening = true; micBtn.classList.add("listening"); micBtn.textContent = "🎙️ LISTENING..."; };
    recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserReply(); };
    recognition.onerror = recognition.onend = () => { isListening = false; micBtn.classList.remove("listening"); micBtn.textContent = "🎤 SPEAK"; };
  } else {
    micBtn.disabled = true; micBtn.textContent = "🎤 NO VOICE";
  }

  function toggleSpeechRecognition() {
    if (!recognition) return;
    if (isListening) recognition.stop(); else recognition.start();
  }

  function speakText(text) {
    if (!ttsEnabled || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.88;
    window.speechSynthesis.speak(u);
  }

  function toggleTTS() {
    ttsEnabled = !ttsEnabled;
    document.getElementById("tts-btn").textContent = ttsEnabled ? "🔊 VOICE: ON" : "🔇 VOICE: OFF";
    if (!ttsEnabled) window.speechSynthesis.cancel();
  }

  async function toggleWebcam() {
    const videoEl = document.getElementById("webcam-view");
    const camBtn = document.getElementById("cam-btn");
    if (webcamStream) {
      webcamStream.getTracks().forEach(t => t.stop());
      webcamStream = null; videoEl.style.display = "none";
      camBtn.textContent = "📷 WEBCAM";
    } else {
      try {
        webcamStream = await navigator.mediaDevices.getUserMedia({ video: true });
        videoEl.srcObject = webcamStream; videoEl.style.display = "block";
        camBtn.textContent = "🛑 STOP CAM";
      } catch (e) { alert("Camera access blocked."); }
    }
  }

  function appendMessage(sender, text) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg " + (sender === "user" ? "user-msg" : "bot-msg");
    msgDiv.textContent = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    if (sender === "bot") speakText(text);
  }

  function renderStudentForm() {
    chatBox.innerHTML = `
      <div class="form-box">
        <h2>👋 Welcome Student!</h2>
        <p>Please enter your information to start practice:</p>
        <div class="form-group">
          <input type="text" id="stu-name" class="input-field" placeholder="Name" required>
          <input type="text" id="stu-class" class="input-field" placeholder="Class (e.g. 701)">
          <input type="text" id="stu-seat" class="input-field" placeholder="Seat #">
        </div>
        <button class="action-btn" onclick="startSession()">START TALKING</button>
      </div>
    `;
  }

  function startSession() {
    const name = document.getElementById("stu-name").value.trim() || "Anonymous";
    const className = document.getElementById("stu-class").value.trim() || "-";
    const seatNum = document.getElementById("stu-seat").value.trim() || "-";

    studentProfile = { name, className, seatNum };

    chatBox.innerHTML = "";
    document.getElementById("input-area").classList.remove("hidden");
    
    score = 0; currentStep = 0; timeLeft = 120;
    startTimer();

    appendMessage("bot", TUTOR_STEPS[currentStep].question);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
      document.getElementById("timer-val").textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
      if (timeLeft <= 0) finishSession(true);
    }, 1000);
  }

  function handleUserReply() {
    const text = userInput.value.trim();
    if (!text || currentStep >= TUTOR_STEPS.length) return;

    appendMessage("user", text);
    userInput.value = "";

    const step = TUTOR_STEPS[currentStep];
    const res = step.evaluate(text);

    if (res.pass) {
      score += 25;
      document.getElementById("score-val").textContent = score;
      appendMessage("bot", res.reply);

      currentStep++;
      setTimeout(() => {
        if (currentStep < TUTOR_STEPS.length) {
          appendMessage("bot", TUTOR_STEPS[currentStep].question);
        } else {
          finishSession(false);
        }
      }, 1800);
    } else {
      setTimeout(() => { appendMessage("bot", res.reply); }, 800);
    }
  }

  async function finishSession(isTimeOut) {
    clearInterval(timerInterval);
    document.getElementById("input-area").classList.add("hidden");

    const payload = {
      name: studentProfile.name,
      className: studentProfile.className,
      seatNum: studentProfile.seatNum,
      score: score,
      accuracy: isTimeOut ? "Time Expired" : "100% Complete"
    };

    try {
      let localData = JSON.parse(localStorage.getItem("tutor_scores") || "[]");
      localData.push(payload);
      localStorage.setItem("tutor_scores", JSON.stringify(localData));
    } catch(e) {}

    try {
      if (LEADERBOARD_WEBAPP_URL !== "PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
        await fetch(LEADERBOARD_WEBAPP_URL, {
          method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
      }
    } catch(e) {}

    const reportCard = document.createElement("div");
    reportCard.className = "form-box";
    reportCard.innerHTML = `
      <h2>🎓 SESSION COMPLETE!</h2>
      <p>Great job practicing English today, <b>${studentProfile.name}</b>!</p>
      <h1 style="color:#f59e0b; font-size: 48px; margin: 12px 0;">⭐ ${score} Stars</h1>
      <p>Score saved (Class ${studentProfile.className}, Seat ${studentProfile.seatNum}).</p>
      <br>
      <button class="action-btn" onclick="renderStudentForm()">TALK AGAIN</button>
    `;
    chatBox.appendChild(reportCard);
    chatBox.scrollTop = chatBox.scrollHeight;
    speakText("Great job practicing English today! Your score has been saved!");
  }

  userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleUserReply(); });

  renderStudentForm();
</script>
</body>
</html>
